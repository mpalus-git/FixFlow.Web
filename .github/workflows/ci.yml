name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Verify generated API types
        run: |
          pnpm api:types
          git diff --exit-code -- src/shared/api/schema.ts

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm check:comments

      - run: pnpm build

  test:
    name: Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: pnpm test --run --shard=${{ matrix.shard }}/3 --coverage --reporter=default --reporter=blob

      - uses: actions/upload-artifact@v7
        with:
          name: test-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: test-blob-*
          path: .vitest/blob
          merge-multiple: true

      - run: pnpm test --run --merge-reports --coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage.txt ]; then
            {
              echo "### Coverage"
              echo '```'
              cat coverage/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: E2E tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Generate secrets
        run: |
          for name in POSTGRES_PASSWORD JWT_SIGNING_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          for name in DEMO_ADMIN_PASSWORD DEMO_DISPATCHER_PASSWORD DEMO_TECHNICIAN_PASSWORD; do
            value="Aa1!$(openssl rand -hex 12)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start API
        run: docker compose -f e2e/compose.yaml up -d

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for API
        run: pnpm e2e:up

      - run: pnpm e2e

      - name: API logs
        if: failure()
        run: docker compose -f e2e/compose.yaml logs api

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  contract-drift:
    name: API contract drift
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare contract with FixFlow.Api main
        run: |
          if ! curl -fsSL https://raw.githubusercontent.com/mpalus-git/FixFlow.Api/main/openapi/v1.json -o "$RUNNER_TEMP/v1.json"; then
            echo "::warning::Could not download the FixFlow.Api contract"
            exit 0
          fi
          if ! cmp -s "$RUNNER_TEMP/v1.json" openapi/fixflow-api.v1.json; then
            echo "::warning::openapi/fixflow-api.v1.json differs from FixFlow.Api main. Run pnpm api:sync and pnpm api:types."
          fi
